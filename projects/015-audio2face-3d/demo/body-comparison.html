<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物表演 · 同音频对照</title><link rel="icon" href="data:,"><link rel="stylesheet" href="characters.css"><style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;margin:0;color:#243d30;background:#f2f4ed}header,main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}a{color:#365c48}h1{font-size:30px;margin:8px 0}p{line-height:1.8}.tabs,.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button{font:inherit;border:1px solid #cbd4c8;border-radius:12px;padding:10px 18px;background:#fff;color:#294d3f;cursor:pointer}button[aria-pressed=true],#play{background:#294d3f;color:white}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fffdf8;border-radius:20px;overflow:hidden}.panel h2,.panel p{margin:16px 22px}.panel h2{font-size:19px}.panel video{display:block;width:100%;height:56vh;object-fit:contain;background:#16221d}.hint{font-size:13px;color:#617265}#status{min-height:24px}details{font-size:13px;line-height:1.9}@media(max-width:600px){header,main{padding:16px}.pair{gap:8px}.panel video{height:40vh}.panel h2,.panel p{margin:12px;font-size:14px}}</style></head><body><header><a href="http://127.0.0.1:8022/effects.html" target="_top">效果与架构总览 ↗</a><span>人物表演 · 同音频对照</span><a href="/characters">上传 / 更换人物 ↗</a></header><main><h1>让人物更有回应感。</h1><p>同一个人物、同一句台词、同一段声音。观察说话时的头肩、眼神和表情，再看句尾嘴部是否安静收住。</p><div id="tabs" class="tabs"></div><div class="pair"><section class="panel"><h2>本地面部版</h2><video id="before" playsinline preload="auto"></video><p>照片主体静止，主要驱动脸和头。</p></section><section class="panel"><h2>自然半身版</h2><video id="after" muted playsinline preload="auto"></video><p>加入自然头肩与上身动作，随语音强弱调整动作节奏。</p></section></div><div class="actions"><button id="play">同步播放对照</button><button id="stop">停止</button><button id="sound">声音开</button><a id="chat" href="/characters">使用自然半身人物对话 ↗</a></div><p id="status" role="status">正在读取对照结果…</p><details><summary>实测与当前限制</summary><p id="evidence"></p><p>同步对照只播放左侧音轨，避免声音重叠。两版使用相同音频，右侧也含相同声音。半身动作由 MiniMax 生成，嘴型在本机生成；不是实时视频流。人物相似度、口腔细节和六秒片段的循环衔接仍需评审。</p><p><a href="http://127.0.0.1:8020/">查看之前的 8020 效果参考 ↗</a></p></details></main><script src="body-comparison.js"></script></body></html>
