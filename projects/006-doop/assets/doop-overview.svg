<text x="70" y="1420" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#3F6856">已有设计规则、Agent 工作流和浏览器验证；遇到实际多人协作问题时，再评估 Doop。</text>
