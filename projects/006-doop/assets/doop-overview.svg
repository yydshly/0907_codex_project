<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540"><title>Doop 架构与类似产品对比</title><desc>人确定目标和验收，AI 操作 HTML 画板。对比四种设计工作方式，当前仅归档。</desc><rect width="100%" height="100%" fill="#F3F5F8"/>
