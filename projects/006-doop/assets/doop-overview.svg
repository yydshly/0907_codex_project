<text x="844" y="632" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#58667A">截图自检不等于结果必然正确；最终由人验收。</text>
<text x="70" y="676" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#435A7B">设计记忆：反馈与样稿 → 规则建议 → 人工确认 → 后续任务上下文（不训练模型）</text>
<text x="65" y="777" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#233047">02  同类产品：工作中心不同，能力有所重叠</text>
<text x="65" y="823" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#58667A">OpenDesign 指 nexu-io/open-design；以下比较定位，不是生成效果排名。</text>
