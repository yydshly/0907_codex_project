const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100),r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=THREE.SRGBColorSpace;r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;document.body.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x81946d,2.4));const light=new THREE.DirectionalLight(0xfff4df,2.8);light.position.set(3,6,5);light.castShadow=true;scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.15}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
new GLTFLoader().load('assets/human-0.glb',g=>{const m=g.scene;scene.add(m);m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});const box=new THREE.Box3().setFromObject(m);m.position.y=-box.min.y;const mixer=new THREE.AnimationMixer(m);mixer.clipAction(g.animations.find(a=>a.name==='wave')).play();mixer.setTime(.6);camera.position.set(1.2,1.7,5.1);camera.lookAt(0,1.35,0);r.render(scene,camera);document.body.dataset.ready='true';},undefined,e=>{document.body.dataset.ready='error';console.error(e);});
</script></html>
