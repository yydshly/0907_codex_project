<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc"><title id="title">FDE Fieldbook 资料、准备方法与实践价值引导图</title><desc id="desc">岗位与技术资料经过 FIELD 方法、案例练习和复盘，形成准备产物。我们的网页整理十套案例、六组技术与实践清单，供求职和项目交付参考。此图是原创研究示意，不是运行系统架构或实测效果。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#50715b" stroke-width="1.5"/></marker></defs><rect width="1440" height="970" fill="#f6f5ef"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="56" y="48" font-size="17" fill="#246342" font-weight="700">013 / REPOSITORY GUIDE</text><text x="56" y="104" font-size="39" fill="#20392e" font-weight="700">FDE Fieldbook：从准备资料到实践方法</text><text x="56" y="145" font-size="22" fill="#606e64" font-weight="400">定位：FDE 面试与工作准备手册  ·  用阅读、练习和复盘帮助人建立能力</text><rect x="56" y="188" width="380" height="245" rx="14" fill="#fffefa" stroke="#d2dccd"/><text x="82" y="228" font-size="23" fill="#20392e" font-weight="700">01  资料输入</text><text x="82" y="274" font-size="20" fill="#20392e" font-weight="400">岗位地图与技术知识</text><text x="82" y="309" font-size="20" fill="#20392e" font-weight="400">10 套分轮证据案例</text><text x="82" y="344" font-size="20" fill="#20392e" font-weight="400">评分表、模板与准备计划</text><text x="82" y="403" font-size="18" fill="#246342" font-weight="600">了解要求，选择重点</text><rect x="530" y="188" width="380" height="245" rx="14" fill="#fffefa" stroke="#d2dccd"/><text x="556" y="228" font-size="23" fill="#20392e" font-weight="700">02  准备方法</text><text x="556" y="274" font-size="20" fill="#20392e" font-weight="400">FIELD：界定 → 调查 → 交付</text><text x="556" y="309" font-size="20" fill="#20392e" font-weight="400">上线学习 → 沉淀复用</text><text x="556" y="344" font-size="20" fill="#20392e" font-weight="400">练习 → 证据评分 → 修正重练</text><text x="556" y="403" font-size="18" fill="#246342" font-weight="600">通过具体行为发现短板</text><rect x="1004" y="188" width="380" height="245" rx="14" fill="#fffefa" stroke="#d2dccd"/><text x="1030" y="228" font-size="23" fill="#20392e" font-weight="700">03  准备产物</text><text x="1030" y="274" font-size="20" fill="#20392e" font-weight="400">项目叙述与设计方案</text><text x="1030" y="309" font-size="20" fill="#20392e" font-weight="400">评测、上线与恢复约定</text><text x="1030" y="344" font-size="20" fill="#20392e" font-weight="400">评分记录、差距与下一步</text><text x="1030" y="403" font-size="18" fill="#246342" font-weight="600">形成可检查的准备成果</text><path d="M450,307 L510,307" fill="none" stroke="#50715b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M924,307 L984,307" fill="none" stroke="#50715b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720,446 L720,490" fill="none" stroke="#50715b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="508" width="1328" height="187" rx="14" fill="#20392e" stroke="#20392e"/><text x="84" y="546" font-size="20" fill="#d9ed98" font-weight="600">我们的库内整理 / projects/013-fde-interview-fieldbook/</text><text x="84" y="594" font-size="25" fill="#fffefa" font-weight="700">案例精读</text><text x="84" y="636" font-size="18" fill="#d2dfd4" font-weight="400">背景 · 误区 · 步骤 · 验收 · 自测</text><text x="521" y="594" font-size="25" fill="#fffefa" font-weight="700">技术速查</text><text x="521" y="636" font-size="18" fill="#d2dfd4" font-weight="400">RAG · Agent · 上下文 · 评测等</text><text x="958" y="594" font-size="25" fill="#fffefa" font-weight="700">实践清单</text><text x="958" y="636" font-size="18" fill="#d2dfd4" font-weight="400">知识助手六步示例 · 可填写模板</text><path d="M720,707 L720,747" fill="none" stroke="#50715b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="765" width="646" height="121" rx="14" fill="#fffefa" stroke="#d2dccd"/><rect x="738" y="765" width="646" height="121" rx="14" fill="#fffefa" stroke="#d2dccd"/><text x="82" y="807" font-size="23" fill="#20392e" font-weight="700">求职准备：系统使用</text><text x="82" y="850" font-size="19" fill="#606e64" font-weight="400">围绕目标岗位，补齐知识、项目表达与面试练习。</text><text x="764" y="807" font-size="23" fill="#20392e" font-weight="700">项目交付：按需借鉴</text><text x="764" y="850" font-size="19" fill="#606e64" font-weight="400">选择真实需求，验证清单，再沉淀自己的方法。</text><text x="56" y="926" font-size="17" fill="#606e64" font-weight="400">原创研究引导图，非上游运行架构或效果证明。代码主要维护资料质量；真人训练效果尚未独立验证。</text><text x="56" y="952" font-size="15" fill="#606e64" font-weight="400">来源：dataPro-lgtm/fde-interview-fieldbook · 研究快照 6b851a9 · 2026-09-07</text></g></svg>