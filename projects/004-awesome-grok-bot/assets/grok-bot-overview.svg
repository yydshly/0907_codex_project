<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Grok Bot 是什么？从资料库到云端 AI 助手</title>
  <desc id="desc">awesome-grok-bot 是资料目录，帮助了解 Grok Bot 产品。用户布置任务，产品在平台托管的云电脑上操作浏览器、终端和连接器，完成研究、开发、跟踪和办公工作。结果存为文件，成功流程保存为 Skill，并通过 Routine 定时复用。无需部署此仓库，不等于模型训练或无限自主运行。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526a83" stroke-width="2"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #182e45; }
      .title { font-size: 48px; font-weight: 700; }
      .h { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 21px; fill: #526a83; }
      .white { fill: #ffffff; }
      .accent { fill: #17635b; }
      .line { fill: none; stroke: #526a83; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f3f6fa"/>
  <rect x="56" y="50" width="8" height="94" rx="4" fill="#238578"/>
  <text x="88" y="92" class="title">Grok Bot：配了一台云电脑的 AI 助手</text>
  <text x="88" y="136" class="body" fill="#526a83">先分清：产品负责干活，awesome-grok-bot 帮你了解它怎么用。</text>

  <rect x="56" y="180" width="570" height="164" rx="20" fill="#ffffff" stroke="#cfdae7" stroke-width="2"/>
  <text x="82" y="225" class="h">资料库 · awesome-grok-bot</text>
  <text x="82" y="267" class="body">官方链接 / 案例 / 教程 / 提示词</text>
  <text x="82" y="309" class="small">用于查阅与借鉴；不包含 Bot 运行引擎</text>
  <path d="M650 260 H738" class="line"/>
  <text x="650" y="239" font-size="20" fill="#526a83">帮助了解</text>
  <rect x="766" y="180" width="778" height="164" rx="20" fill="#e3f2ed" stroke="#a7cfc1" stroke-width="2"/>
  <text x="796" y="225" class="h accent">AI 产品 · Grok Bot</text>
  <text x="796" y="267" class="body">平台提供云电脑，接收任务并操作真实工具</text>
  <text x="796" y="309" class="small">无需部署此仓库；关掉个人电脑，云端工作仍可继续</text>

  <text x="56" y="401" class="h">怎么工作</text>
  <rect x="56" y="426" width="325" height="235" rx="20" fill="#ffffff" stroke="#cfdae7" stroke-width="2"/>
  <text x="84" y="475" class="h">① 你布置任务</text>
  <text x="84" y="523" class="body">目标与参考资料</text>
  <text x="84" y="565" class="body">工具权限与完成标准</text>
  <text x="84" y="626" class="small">通过聊天交办与检查</text>
  <path d="M397 543 H441" class="line"/>
  <rect x="463" y="426" width="674" height="235" rx="20" fill="#183b52"/>
  <text x="493" y="475" class="h white">② AI 在托管云电脑上执行</text>
  <rect x="493" y="500" width="180" height="48" rx="10" fill="#31566c"/>
  <rect x="695" y="500" width="180" height="48" rx="10" fill="#31566c"/>
  <rect x="897" y="500" width="210" height="48" rx="10" fill="#31566c"/>
  <text x="529" y="533" class="body white">浏览器</text>
  <text x="721" y="533" class="body white">终端与文件</text>
  <text x="916" y="533" class="body white">连接器 / MCP</text>
  <text x="493" y="589" class="body white">决定下一步 → 操作工具 → 观察结果 → 继续</text>
  <text x="493" y="630" font-size="21" style="fill:#c5d9e5">遇到登录验证或需要你决定的步骤，交给你处理</text>
  <path d="M1153 543 H1197" class="line"/>
  <rect x="1219" y="426" width="325" height="235" rx="20" fill="#ffffff" stroke="#cfdae7" stroke-width="2"/>
  <text x="1247" y="475" class="h">③ 交付与保存</text>
  <text x="1247" y="523" class="body">代码 / 报告 / 表格</text>
  <text x="1247" y="565" class="body">检查结果，后续接着做</text>
  <text x="1247" y="626" class="small">持久工作区保存成果</text>

  <rect x="56" y="690" width="1488" height="112" rx="18" fill="#e8edf6"/>
  <text x="82" y="736" class="h">能做什么</text>
  <text x="330" y="736" class="body">项目研究</text>
  <text x="632" y="736" class="body">软件开发</text>
  <text x="934" y="736" class="body">定期跟踪</text>
  <text x="1236" y="736" class="body">产品与办公</text>
  <text x="330" y="775" class="small">查资料，做对比</text>
  <text x="632" y="775" class="small">写代码，跑检查</text>
  <text x="934" y="775" class="small">看更新，出简报</text>
  <text x="1236" y="775" class="small">整理反馈与数据</text>

  <rect x="56" y="828" width="724" height="137" rx="18" fill="#ffffff" stroke="#cfdae7" stroke-width="2"/>
  <text x="82" y="874" class="h">成果沉淀 · 留下“做出了什么”</text>
  <text x="82" y="916" class="body">保存代码、资料与报告，下次继续使用</text>
  <text x="82" y="946" class="small">重要结果存入持久工作区；登录状态可能过期</text>
  <rect x="806" y="828" width="738" height="137" rx="18" fill="#e3f2ed" stroke="#a7cfc1" stroke-width="2"/>
  <text x="832" y="874" class="h accent">流程沉淀 · 留下“以后怎么做”</text>
  <text x="832" y="916" class="body">做成功 → 保存 Skill → 验证 → 设置 Routine</text>
  <text x="832" y="946" class="small">Skill 管方法，Routine 管何时运行；不等于训练模型</text>

  <text x="56" y="1012" font-size="25" font-weight="700">对我们：找一个重复任务 → 明确成果 → 实测效果 → 沉淀可复用方法</text>
  <text x="56" y="1054" class="small">边界：持续运行不等于无限自主工作；同账号多 Bot 共享电脑与登录态，角色不构成权限隔离。</text>
  <text x="56" y="1091" font-size="18" fill="#64788c">004 · 项目研究 / 2026-09-07 / 依据仓库与官方文档整理 / 原创概念图，非官方内部架构或实测结果</text>
</svg>
