<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>010 · Three.js 技能特效体验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1019;color:#e7edf5;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{display:grid;grid-template-columns:300px 1fr;height:100vh}aside{padding:26px 22px;overflow:auto;border-right:1px solid #253044;background:linear-gradient(160deg,#182337,#0b111c)}small{color:#80d7c7;letter-spacing:2px}h1{font-size:25px;margin:12px 0}p{color:#aebdd0}#skills{display:grid;gap:7px}button,a{font:inherit}button{cursor:pointer;border:1px solid #334359;border-radius:9px;background:#172338;color:#e9f1fa;padding:10px 13px;text-align:left}button:hover,button.active{border-color:#80d7c7;background:#223d48}button:disabled{opacity:.4;cursor:wait}button span{display:block;color:#a7b8cb;font-size:11px}button b{float:right;color:#7cddcd}button:focus-visible,a:focus-visible{outline:2px solid #80d7c7;outline-offset:3px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tools button{font-size:12px;padding:7px 10px}a{color:#80d7c7}section{position:relative;min-width:0;display:flex;flex-direction:column}header{padding:13px 22px;background:#101927;border-bottom:1px solid #253044;display:flex;justify-content:space-between;gap:12px}#status{color:#adc3d8;font-size:12px}iframe{border:0;width:100%;flex:1;min-height:0}.note{font-size:12px;margin-bottom:0}label{display:flex;gap:8px;margin:14px 0;color:#c1d0e1}footer{padding-top:16px;font-size:11px;color:#7890aa}@media(max-width:800px){main{height:100dvh;grid-template-columns:1fr;grid-template-rows:300px minmax(0,1fr)}aside{padding:14px;overflow:auto}#skills{grid-template-columns:repeat(2,1fr)}section{min-height:0}h1{margin:5px 0;font-size:20px}aside>p{margin:6px 0;font-size:12px}header{font-size:12px;padding:8px 12px}}
</style></head><body><main><aside><small>010 / INTERACTIVE LAB</small><h1>技能特效体验</h1><p>七种施法效果，三种角色增益。点击下方技能，直接看它如何出现、运动和消失。</p><div id="skills"></div><label><input id="manual" type="checkbox">自己瞄准，再点击场景释放</label><div class="tools"><button data-action="boost">电能增益 B</button><button data-action="magic">魔法增益 M</button><button data-action="fire">火焰增益 K</button></div><div class="tools"><button data-action="togglePause" id="pause">暂停 / 继续 P</button><button data-action="toggleEditor">调参面板 G</button><button data-action="clear">清空效果 C</button></div><p class="note">右键拖动旋转视角，滚轮缩放。暂停后仍可打开调参面板修改效果。手动模式请把鼠标移入场景。</p><footer>运行的是上游真实 Three.js 场景。中文操作栏为本项目添加。<br><a href="./showcase.html">← 返回特效与场景实验室</a><br><a href="./index.html" target="_blank" rel="noopener">打开原版完整界面 ↗</a> · <a href="https://github.com/achrefelouafi/LinearAbilityExtThreeJS" target="_blank" rel="noopener">上游源码 ↗</a></footer></aside><section><header><strong id="current">Elemental Sandbox</strong><span id="status" role="status">正在加载模型与着色器…</span></header><iframe id="scene" src="./index.html" title="Three.js 原版技能特效场景" allow="fullscreen"></iframe></section></main><script>
const skills=[['pyre','火焰冠','火焰环升起，燃烧后化为余烬','Q'],['kraken','深海触手','触手伸出裂隙，轮流砸向地面','E'],['electrical','电能球','球体悬浮，表面电弧流动','R'],['earth','地裂石塔','裂纹沿直线推进，石塔升起','F'],['portal','翠绿石门','石块逐层拼装，门内亮起','V'],['aether','潮汐圆环','地面组装圆环，再翻转立起','X'],['firePortal','火焰传送门','火星描边，在空中形成黑色圆面','Z']];
const frame=document.querySelector('#scene'),status=document.querySelector('#status');let app;
document.querySelector('#skills').innerHTML=skills.map(([id,name,desc,key])=>`<button data-skill="${id}"><b>${key}</b>${name}<span>${desc}</span></button>`).join('');
const controls=[...document.querySelectorAll('button')];controls.forEach(b=>b.disabled=true);
const started=Date.now();const ready=setInterval(()=>{try{app=frame.contentWindow.app;if(!app){if(Date.now()-started>60000)status.textContent='首次加载较慢；可打开原版查看加载提示。';return;}clearInterval(ready);const clean=frame.contentDocument.createElement("style");clean.textContent=".hud__title,.hud__help{display:none!important}";frame.contentDocument.head.append(clean);app.editor.toggle();controls.forEach(b=>b.disabled=false);status.textContent='已就绪 · 点击左侧技能开始';}catch(e){status.textContent='场景连接失败，请刷新页面。';clearInterval(ready);}},400);
document.querySelector('#skills').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!app)return;const id=b.dataset.skill;document.querySelectorAll('[data-skill]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#current').textContent=skills.find(s=>s[0]===id)[1];
if(app.paused)app.input.emit('action','togglePause');app.clearEffects();app.cooldowns.set(id,0);app.selectAbility(id);if(document.querySelector('#manual').checked){app.armAbility(id);status.textContent='移动鼠标瞄准 · 点击地面释放';frame.contentWindow.focus();}else{const direction=app.aim.origin.clone().sub(app.camera.position).setY(0).normalize();app.aim.yaw=Math.atan2(direction.x,direction.z);app.aim.emit('cast',app.aim.origin,direction,8);status.textContent='正在展示 · 可旋转视角或暂停调参';}});
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(!app)return;app.input.emit('action',b.dataset.action);status.textContent=app.paused?'已暂停 · 调参仍会更新画面':'运行中 · 可继续选择技能';}));
</script></body></html>
