<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>010 · 特效与场景实验室</title><link rel="stylesheet" href="./lab.css"></head><body>
<header class="top"><a class="brand" href="./showcase.html">✳ 特效与场景实验室 <small>010 / THREE.JS</small></a><a href="./skills.html">原版七种技能 ↗</a></header>
<main><aside><div class="eyebrow">EXPLORE THE POSSIBILITIES</div><h1>从效果，到用途。</h1><p class="intro">先看视觉变化，再进入实际场景。每一项都是可操作的实时三维演示。</p><nav aria-label="演示分类"><button id="effectsTab">特效素材 <b>10</b></button><button id="scenesTab" class="selected">应用场景 <b>5</b></button></nav><div id="catalog"></div><p class="source">新增内容为本项目参考粒子、组装、描边等思路制作的演示，非上游自带功能。</p></aside>
<section class="workspace"><div class="stage" id="stage"><canvas id="viewport" aria-label="实时三维特效，可拖动旋转和滚轮缩放"></canvas><div class="stage-top"><span id="kind">SCENE 01</span><span id="renderState" role="status">正在初始化…</span></div><div class="stage-title"><h2 id="title"></h2><p id="subtitle"></p></div><div id="labels" aria-hidden="true"></div><div class="stage-bottom"><span id="phase"></span><span>拖动旋转 · 滚轮缩放</span></div><div id="error" role="alert" hidden></div></div>
<div class="controls"><button id="play">暂停</button><button id="reset">重播</button><label>速度 <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1"><output id="speedValue">1.0×</output></label><label>密度 <input id="density" type="range" min="0.25" max="1" step="0.05" value="0.75"><output id="densityValue">75%</output></label><label>配色 <input id="color" type="color" value="#66e3cf"></label><button id="special">展开 / 组装</button><label class="timeline">演示进度 <input id="progress" type="range" min="0" max="100" step="0.1" value="0"><output id="progressValue">0%</output></label></div>
<article><div><span class="eyebrow">本次演示</span><h3 id="purpose"></h3><p id="description"></p></div><div><span class="eyebrow">可以怎样扩展</span><p id="extension"></p><div class="boundary"><b>接入条件</b><span id="boundary"></span></div></div></article></section></main><script type="module" src="./lab.js"></script></body></html>
