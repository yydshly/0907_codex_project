<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
<title id="title">Rome：多 Agent 与可复用应用平台整体架构</title>
<desc id="desc">用户和自动触发进入 Rome 核心。Agent 负责判断，Action 负责执行，App 将技能、动作、界面与数据组织成能力包。稳定流程可直接执行代码；记忆与业务状态持续保存。底部列出未来多 Agent 开发可参考的原则与当前边界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17283e}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#51647c}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#51647c}.label{font-size:18px;font-weight:700;fill:#365a80}.line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}</style>
<rect width="1440" height="1200" fill="#f5f7fb"/>

<text x="44" y="57" class="title">Rome · 多 Agent + 工作流自动化 + 可扩展应用</text>
<text x="44" y="94" class="sub">我们的理解：AI 负责判断，代码负责执行，App 承载能力，平台让它们持续协作与复用。</text>
<rect x="44" y="126" width="655" height="103" rx="14" fill="#ffffff" stroke="#d5dfea"/>
<text x="66" y="162" class="head">人的入口</text>
<text x="66" y="195" class="body">聊天 / 网页工作台 / 专用应用界面</text>
<rect x="723" y="126" width="673" height="103" rx="14" fill="#ffffff" stroke="#d5dfea"/>
<text x="745" y="162" class="head">自动触发 · Routine</text>
<text x="745" y="195" class="body">定时 / Webhook / 事件 / 轮询 → 调用已保存的 Action</text>
<path d="M370 229V261" class="line"/>
<path d="M1060 229V261" class="line"/>
<rect x="44" y="266" width="1352" height="104" rx="14" fill="#eaf0f8" stroke="#b6c8df"/>
<text x="66" y="302" class="head">Rome 核心 · 统一管理工作</text>
<text x="66" y="335" class="body">会话与消息路由  ·  权限与审批  ·  应用注册与发现  ·  执行记录与取消</text>
<path d="M300 370V410" class="line"/>
<text x="324" y="397" class="small">需要理解与判断</text>
<path d="M1070 370V410" class="line"/>
<text x="1092" y="397" class="small">稳定步骤直接执行</text>
<rect x="44" y="415" width="655" height="183" rx="14" fill="#eef5ff" stroke="#b8cfee"/>
<text x="66" y="451" class="head">Agent 判断层</text>
<text x="66" y="484" class="body">主 Agent 理解目标、查找能力、组织步骤</text>
<text x="66" y="513" class="body">按角色委派受限子 Agent；Skill 提供方法与规则</text>
<text x="66" y="542" class="body">通过供应商适配层调用外部模型</text>
<rect x="765" y="415" width="631" height="183" rx="14" fill="#eaf7f2" stroke="#b5d9cb"/>
<text x="787" y="451" class="head">Action 执行层</text>
<text x="787" y="484" class="body">运行已注册代码，调用工具与外部服务</text>
<text x="787" y="513" class="body">核心进程管理工作进程、父子调用和取消</text>
<text x="787" y="542" class="body">敏感动作可先审批；需要判断时也可调用 Agent</text>
<path d="M699 493H765" class="line"/>
<text x="703" y="477" class="small">调用</text>
<path d="M765 548H699" class="line"/>
<text x="703" y="575" class="small">结果</text>
<path d="M300 640V598" class="line" stroke-dasharray="7 5"/>
<path d="M1070 640V598" class="line" stroke-dasharray="7 5"/>
<rect x="44" y="645" width="1352" height="131" rx="14" fill="#fff7e7" stroke="#e4d2aa"/>
<text x="66" y="681" class="head">Rome App · 可安装的能力包（通过 app.yaml 声明）</text>
<text x="66" y="714" class="body">Agent 角色  +  Skill 方法  +  Action 动作  +  Hook 事件处理  +  Web UI / API  +  持久数据</text>
<text x="66" y="743" class="body">人通过界面使用；AI 通过动作与技能使用；同一功能也能由自动化调用。</text>
<text x="525" y="628" class="small">虚线：App 向运行层提供能力</text>
<path d="M370 776V808" class="line"/>
<path d="M1070 776V808" class="line"/>
<rect x="44" y="813" width="655" height="132" rx="14" fill="#ffffff" stroke="#d5dfea"/>
<text x="66" y="849" class="head">持久资产与状态</text>
<text x="66" y="882" class="body">记忆与代码：Git 历史，可追溯与修改</text>
<text x="66" y="911" class="body">数据库与文件：会话、审批、执行记录、应用数据</text>
<rect x="723" y="813" width="673" height="132" rx="14" fill="#ffffff" stroke="#d5dfea"/>
<text x="745" y="849" class="head">外部执行环境</text>
<text x="745" y="882" class="body">模型服务 / 网站与业务接口 / 浏览器 / 文件与工具</text>
<text x="745" y="911" class="body">Action 与适配器连接这些环境，具体能力需实现与授权</text>
<rect x="44" y="970" width="1352" height="119" rx="14" fill="#edf1f6" stroke="#d5dfea"/>
<text x="66" y="1006" class="head">后续开发多 Agent：优先参考这些设计</text>
<text x="66" y="1039" class="body">① 统一动作接口   ② 角色分工与权限   ③ 任务状态和取消   ④ 人工审批与执行日志</text>
<text x="66" y="1068" class="body">⑤ 稳定流程用代码复用   ⑥ 方法、数据与界面一起沉淀；新增能力须验证效果</text>
<text x="44" y="1121" class="small">边界：当前核心为单租户、单主进程；不是传统 OS。自动评估、清理与递归改进仍在建设中。</text>
<text x="44" y="1152" class="small">本图为原创研究概括，非官方架构图或实测证明。箭头为主要关系，省略部分回调与数据读写。</text>
<text x="44" y="1181" class="small">来源：rome-os/rome · commit 3f3d001 · 研究日期 2026-09-07</text>
</svg>